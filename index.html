<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Two Games</title>
</head>
<body>
    <h1>Joseph Nilson</h1>
    <h1>Shall We Play A Game?</h1>

    <div class="tabs" id="games">
        <hr>
        <ul>
            <li class="trigger" data-target="#coinGame">Coin Toss</li>
            <li class="trigger" data-target="#guessingGame">Guessing Game</li>
        </ul>
        <hr>
        <div class="content active"></div>
        <div class="content" id="coinGame">
            <h2>Coin Toss Game</h2>
            <input type="button" value="Heads" class="button">
            <input type="button" value="Tails" class="button"> <br><br>
            <img src="images/both.jpg" id="coinImage">
            <h3 id="result"></h5> 
            <p id="wins">Wins = 0</p> <p id="losses">Losses = 0</p>
        </div>

        <div class="content" id="guessingGame">
            <h2>Number Guessing Game</h2>
            <p>I have selected a random number between 1 and 100.<br>See if you can guess it in 10 turns or fewer.<br>I'll tell you if your guess was too high or too low.</p>
            <form>
                <label>Enter a guess:</label>
                <input type="text" id="numberGuess">
            </form>
            <p id="prevGuesses"></p>
            <span><p></p></span>
        </div>
    </div>

    <script src="scripts/tabs.js"></script>
    <script src="scripts/coingame.js"></script>
    <script src="scripts/guessinggame.js"></script>
    
</body>
</html>
